# 生产环境配置
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
  
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  
  # 禁用 Flyway（已手动执行迁移）
  flyway:
    enabled: false

# JWT 密钥（生产环境从环境变量读取）
jwt:
  secret: ${JWT_SECRET}
  expiration: 7200000       # 2小时
  refresh-expiration: 604800000  # 7天

# 文件上传路径
file:
  upload:
    path: ${FILE_UPLOAD_PATH:/data/uploads}

# 日志级别
logging:
  level:
    root: WARN
    com.species.atlas: INFO
    org.springframework.security: WARN
  file:
    name: /var/log/species-atlas/app.log

# 生产环境关闭 Swagger
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
