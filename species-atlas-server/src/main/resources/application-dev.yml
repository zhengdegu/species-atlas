# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/species_atlas?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123456
  
  flyway:
    enabled: false
  
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

# JWT 密钥（开发环境）
jwt:
  secret: dev-species-atlas-jwt-secret-key-2024-should-be-at-least-256-bits-long-for-security
  expiration: 86400000  # 开发环境 Token 24小时有效

# 日志级别（开发环境更详细）
logging:
  level:
    root: INFO
    com.species.atlas: DEBUG
    org.springframework.security: DEBUG

# API 文档
springdoc:
  swagger-ui:
    enabled: true
