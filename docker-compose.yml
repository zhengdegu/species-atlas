# ============================================
# Species Atlas - Docker Compose
# 生产环境配置
# 数据保存在当前目录的 .data 文件夹中
# ============================================

version: '3.8'

services:
  # ==========================================
  # MySQL 数据库
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: species-atlas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-species_atlas}
      MYSQL_USER: ${MYSQL_USER:-species}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-species123456}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # 数据库数据保存到当前目录
      - ./.data/mysql:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - species-network

  # ==========================================
  # 后端服务
  # ==========================================
  server:
    build:
      context: ./species-atlas-server
      dockerfile: Dockerfile.local
    image: species-atlas-server:${VERSION:-latest}
    container_name: species-atlas-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Spring 配置
      SPRING_PROFILES_ACTIVE: prod
      # 数据库配置
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-species_atlas}
      DB_USERNAME: ${MYSQL_USER:-species}
      DB_PASSWORD: ${MYSQL_PASSWORD:-species123456}
      # JWT 配置 - 重要：生产环境必须在 .env 文件中设置 JWT_SECRET
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET environment variable is required}
      # 文件上传路径（映射到本地目录）
      FILE_UPLOAD_PATH: /app/uploads
      # JVM 配置
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
      TZ: Asia/Shanghai
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # 上传文件和日志保存到当前目录
      - ./.data/uploads:/app/uploads
      - ./.data/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/auth/test"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - species-network

  # ==========================================
  # 前端服务
  # ==========================================
  web:
    build:
      context: ./species-atlas-web
      dockerfile: Dockerfile.local
    image: species-atlas-web:${VERSION:-latest}
    container_name: species-atlas-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - species-network

# 不再使用 Docker volumes，数据直接保存到本地目录

# ==========================================
# 网络
# ==========================================
networks:
  species-network:
    name: species-atlas-network
    driver: bridge
